<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="a-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#07111F" flood-opacity="0.8" />
    </filter>
    <filter id="ribbon-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <linearGradient id="a-grad" x1="200" y1="40" x2="200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E65B5" />
      <stop offset="1" stop-color="#0B4188" />
    </linearGradient>
    <pattern id="constellation" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#FFFFFF" fill-opacity="0.5" />
      <circle cx="60" cy="30" r="2" fill="#FFFFFF" fill-opacity="0.7" />
      <circle cx="30" cy="70" r="1.5" fill="#FFFFFF" fill-opacity="0.5" />
      <circle cx="70" cy="60" r="1" fill="#FFFFFF" fill-opacity="0.4" />
      <path d="M 20 20 L 60 30 L 70 60 L 30 70 Z" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.2" fill="none" />
      <path d="M 20 20 L 30 70" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.2" fill="none" />
      <path d="M 60 30 L 100 20" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.2" fill="none" />
      <path d="M 70 60 L 80 110" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.2" fill="none" />
      <path d="M 20 20 L -20 30" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.2" fill="none" />
      <path d="M 30 70 L 20 100" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.2" fill="none" />
    </pattern>

    <g id="orbital-group">
      <path d="M 10 220 A 190 70 0 0 0 390 220 A 190 70 0 0 0 10 220" fill="none" stroke="#FF9933" stroke-width="10" stroke-linecap="round" pathLength="1000" stroke-dasharray="600 400" stroke-dashoffset="641" />
      <path d="M 20 220 A 180 60 0 0 0 380 220 A 180 60 0 0 0 20 220" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" pathLength="1000" stroke-dasharray="600 400" stroke-dashoffset="641" />
      <path d="M 30 220 A 170 50 0 0 0 370 220 A 170 50 0 0 0 30 220" fill="none" stroke="#138808" stroke-width="10" stroke-linecap="round" pathLength="1000" stroke-dasharray="600 400" stroke-dashoffset="641" />
      <g transform="translate(20, 220) rotate(-90)">
        <g transform="scale(1.2)">
          <path d="M 0 0 L -10 -25 L -20 -25 L -5 0 Z" fill="#E2E8F0" />
          <path d="M 0 0 L -10 25 L -20 25 L -5 0 Z" fill="#CBD5E1" />
          <path d="M -25 0 L -30 -12 L -34 -12 L -28 0 Z" fill="#E2E8F0" />
          <path d="M -25 0 L -30 12 L -34 12 L -28 0 Z" fill="#CBD5E1" />
          <path d="M -30 -4 L 15 -4 C 25 -4 35 -1 35 0 C 35 1 25 4 15 4 L -30 4 C -32 4 -34 2 -34 0 C -34 -2 -32 -4 -30 -4 Z" fill="#FFFFFF" />
          <path d="M 20 -2 L 25 -1 L 25 1 L 20 2 Z" fill="#0F172A" />
        </g>
      </g>
    </g>

    <clipPath id="clip-back">
      <rect x="0" y="0" width="400" height="221" />
    </clipPath>
    <clipPath id="clip-front">
      <rect x="0" y="219" width="400" height="181" />
    </clipPath>
  </defs>

  <use href="#orbital-group" clip-path="url(#clip-back)" />

  <g filter="url(#a-glow)">
    <path d="M 200 40 L 320 340 L 280 340 L 248 260 L 152 260 L 120 340 L 80 340 Z M 200 140 L 168 220 L 232 220 Z" fill="url(#a-grad)" stroke="url(#a-grad)" stroke-width="16" stroke-linejoin="round" fill-rule="evenodd" />
    <path d="M 200 40 L 320 340 L 280 340 L 248 260 L 152 260 L 120 340 L 80 340 Z M 200 140 L 168 220 L 232 220 Z" fill="url(#constellation)" stroke="url(#constellation)" stroke-width="16" stroke-linejoin="round" fill-rule="evenodd" />
  </g>

  <use href="#orbital-group" clip-path="url(#clip-front)" filter="url(#ribbon-shadow)" />
</svg>
